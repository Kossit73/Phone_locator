<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Share Link Ready</title>
    <style>
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        max-width: 720px;
        margin: 3rem auto;
        background: #111827;
        padding: 2.5rem;
        border-radius: 16px;
      }
      h1 {
        font-size: 2rem;
      }
      .card {
        background: #1e293b;
        padding: 1.5rem;
        border-radius: 12px;
        margin: 1.5rem 0;
        word-break: break-all;
      }
      a {
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Share link created</h1>
      <p>Send this link to {{ phone_number }} so they can share their location.</p>
      <div class="card">
        <strong>Share link:</strong>
        <div><a href="{{ share_url }}">{{ share_url }}</a></div>
      </div>
      <div class="card">
        <strong>Tracking page:</strong>
        <div><a href="{{ track_url }}">{{ track_url }}</a></div>
      </div>
      <p>
        After they share their location, refresh the tracking page to see the latest
        update.
      </p>
    </main>
  </body>
</html>
